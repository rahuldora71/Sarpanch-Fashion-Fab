# ============================================================
# SARPANCH FASHION FAB (SFF) — PRODUCTION PROFILE CONFIGURATION
# ============================================================

spring.application.name=Auth-app

# ------------------------------------------------------------
# SERVER & PORT BINDING (Render dynamic $PORT)
# ------------------------------------------------------------
server.port=${PORT:8080}
server.address=0.0.0.0

# ------------------------------------------------------------
# PRODUCTION DATABASE (MySQL 8.0+)
# ------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Settings
# Note: For production safely, default to 'update' or 'validate'
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# LOGGING (Sanitized for production)
# ------------------------------------------------------------
logging.level.root=INFO
logging.level.com.sff=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# ------------------------------------------------------------
# ACTUATOR & HEALTH MONITORING (Render Health Check)
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ------------------------------------------------------------
# JWT & SESSION SECURITY
# ------------------------------------------------------------
security.jwt.secret-key=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:api.sarpanchfashionfab.com}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:2592000}
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_TOKEN_COOKIE_NAME:refresh_token}

# Cross-Site Cookie Settings (Required when Frontend is on Vercel and Backend is on Render)
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:None}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:}

# ------------------------------------------------------------
# OAUTH2 SOCIAL LOGIN (Google & GitHub)
# ------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# Frontend OAuth2 Redirect URIs
app.auth.frontend.success-redirect=${AUTH_SUCCESS_REDIRECT_URI:https://sarpanch-fashion-fab.vercel.app/dashboard}
app.auth.frontend.failure-redirect=${AUTH_FAILURE_REDIRECT_URI:https://sarpanch-fashion-fab.vercel.app/unauthorized}

# ------------------------------------------------------------
# CORS POLICY (Configured strictly for Vercel production origin)
# ------------------------------------------------------------
app.cors.frontend.allowed-origins=${CORS_ALLOWED_ORIGINS:https://sarpanch-fashion-fab.vercel.app}

# ------------------------------------------------------------
# CLOUDINARY CDN (Uncompressed Paper Slips & Posture Photos)
# ------------------------------------------------------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ------------------------------------------------------------
# EMAIL / SMTP (Password recovery OTP tokens)
# ------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password Recovery
app.security.password-reset.otp-ttl-seconds=${PASSWORD_RESET_OTP_TTL:300}
app.security.password-reset.resend-interval-seconds=${PASSWORD_RESET_RESEND_INTERVAL:60}
app.security.password-reset.max-attempts=${PASSWORD_RESET_MAX_ATTEMPTS:5}

# ------------------------------------------------------------
# META WHATSAPP CLOUD API WEBHOOK
# ------------------------------------------------------------
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.api-version=${WHATSAPP_API_VERSION:v21.0}
